<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DinoCare 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#ffe7d1,#dce8ff);color:#282442}.app{max-width:1120px;margin:auto;padding:16px;display:grid;grid-template-columns:1.35fr .8fr;gap:16px}.game,.panel{border:3px solid #282442;border-radius:24px;box-shadow:0 12px #28244222}.game{position:relative;min-height:620px;overflow:hidden;background:#a9d5fc}#scene,canvas{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;z-index:2;top:15px;left:15px;right:15px;display:flex;justify-content:space-between}.badge,.clock,.bubble{border:2px solid #282442;background:#fffaf0;border-radius:999px;padding:8px 12px;font-weight:800;box-shadow:0 4px #282442}.bubble{position:absolute;z-index:2;top:75px;left:50%;transform:translateX(-50%);width:80%;border-radius:18px;text-align:center;background:#fff}.panel{padding:20px;background:#ffffffdd;backdrop-filter:blur(8px)}h1{margin:0 0 4px}.sub{color:#686080}.stats{display:grid;gap:10px;margin:18px 0}.stat{display:grid;grid-template-columns:76px 1fr 34px;gap:7px;align-items:center;font-size:.85rem;font-weight:800}.bar{height:14px;border:2px solid #282442;border-radius:10px;overflow:hidden;background:#e8e4f0}.fill{height:100%;width:50%}.food{background:#ffd767}.fun{background:#ff78a6}.energy{background:#7565ef}.clean{background:#66d39b}.info,.actions,.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.info{margin:14px 0}.info div{padding:8px;text-align:center;border:2px solid #282442;border-radius:12px;background:#fff}.info b,.info small{display:block}.actions{grid-template-columns:repeat(2,1fr)}button,input{font:inherit}button{border:2px solid #282442;border-radius:12px;background:#fff;padding:10px;font-weight:800;box-shadow:0 4px #282442;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px #282442}.primary{grid-column:span 2;background:#7565ef;color:#fff}.name{display:flex;gap:7px}.name input{min-width:0;flex:1;border:2px solid #282442;border-radius:12px;padding:10px}.foods{grid-template-columns:repeat(4,1fr)}.food{min-height:70px;padding:6px;touch-action:none}.food span{display:block;font-size:1.8rem}.food.selected{background:#fff0a9}.hint,.help{font-size:.78rem;color:#686080;line-height:1.4}.drag{position:fixed;z-index:5;display:none;pointer-events:none;font-size:3rem;transform:translate(-50%,-50%)}@media(max-width:800px){.app{grid-template-columns:1fr}.game{min-height:470px}}@media(max-width:420px){.game{min-height:410px}.panel{padding:14px}.stat{grid-template-columns:65px 1fr 30px;font-size:.75rem}}
</style>
</head><body><main class="app"><section class="game"><div id="scene"></div><div class="top"><div class="badge">DINOCARE 3D</div><div class="clock" id="clock"></div></div><div class="bubble" id="speech">Um pequeno ovo está esperando por você...</div></section><aside class="panel"><h1 id="dinoName">Meu Dino</h1><p class="sub">Cuide do seu companheiro virtual.</p><div class="name"><input id="nameInput" maxlength="14" placeholder="Nome do Dino"><button id="saveName">Salvar</button></div><div class="stats"><div class="stat"><span>🍎 Fome</span><div class="bar"><div id="foodBar" class="fill food"></div></div><b id="foodValue">55</b></div><div class="stat"><span>💖 Alegria</span><div class="bar"><div id="funBar" class="fill fun"></div></div><b id="funValue">60</b></div><div class="stat"><span>⚡ Energia</span><div class="bar"><div id="energyBar" class="fill energy"></div></div><b id="energyValue">70</b></div><div class="stat"><span>🫧 Higiene</span><div class="bar"><div id="cleanBar" class="fill clean"></div></div><b id="cleanValue">65</b></div></div><div class="info"><div><b id="ageValue">0</b><small>dias</small></div><div><b id="stageValue">Ovo</b><small>fase</small></div><div><b id="careValue">0</b><small>cuidados</small></div></div><div class="actions"><button class="primary" id="hatch">🥚 Ajudar a nascer</button><button id="pet">💖 Carinho</button><button id="play">🎾 Brincar</button><button id="clean">🫧 Limpar</button><button id="sleep">🌙 Dormir</button><button id="reset">♻️ Novo ovo</button></div><h3>Escolha uma comida</h3><div class="foods"><button class="food" data-food="apple"><span>🍎</span><small>Maçã</small></button><button class="food" data-food="berry"><span>🍓</span><small>Fruta</small></button><button class="food" data-food="meat"><span>🍖</span><small>Petisco</small></button><button class="food" data-food="leaf"><span>🥬</span><small>Folha</small></button></div><p class="hint" id="hint">Arraste uma comida até a boca do Dino.</p><p class="help">Funciona com mouse e toque. O progresso fica salvo no computador.</p></aside></main><div class="drag" id="drag"></div>
<script type="module">
import * as THREE from './vendor/three.module.js';
const $=id=>document.getElementById(id),KEY='dinocare-3d-save',foods={apple:['🍎','maçã',18],berry:['🍓','frutinha',12],meat:['🍖','petisco',25],leaf:['🥬','folha',10]};let s=Object.assign({name:'Meu Dino',food:55,fun:60,energy:70,clean:65,age:0,care:0,born:false,last:Date.now()},JSON.parse(localStorage.getItem(KEY)||'{}')),scene,camera,renderer,dino,egg,mouth,dragging=false,moved=false,chosen=null,sleeping=false,chew=0;
function save(){s.last=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}function clamp(v){return Math.max(0,Math.min(100,Math.round(v)))}function say(t){$('speech').textContent=t}function update(){let avg=(s.food+s.fun+s.energy+s.clean)/4;s.stage=!s.born?'Ovo':s.age>=7?(avg>65?'Dino Feliz':'Dino Jovem'):s.age>=3?(avg>65?'Dino Forte':'Dino Jovem'):'Bebê';$('dinoName').textContent=s.name;$('nameInput').value=s.name;for(let k of ['food','fun','energy','clean']){$(k+'Value').textContent=s[k];$(k+'Bar').style.width=s[k]+'%'}$('ageValue').textContent=s.age;$('stageValue').textContent=s.stage;$('careValue').textContent=s.care;$('hatch').disabled=s.born;$('hatch').textContent=s.born?'✨ Dino nasceu':'🥚 Ajudar a nascer';save()}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75})}function sph(g,c,sc,p){let m=new THREE.Mesh(new THREE.SphereGeometry(1,22,16),mat(c));m.scale.set(...sc);m.position.set(...p);m.castShadow=true;g.add(m);return m}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color('#a9d5fc');camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,2.2,8);camera.lookAt(0,1,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;$('scene').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight('#fff','#6670a0',2.5));let l=new THREE.DirectionalLight('#fff',3);l.position.set(-4,8,6);scene.add(l);let floor=new THREE.Mesh(new THREE.CircleGeometry(6,48),mat('#a8e5b2'));floor.rotation.x=-Math.PI/2;floor.position.y=-1.1;floor.scale.set(1.4,.65,1);scene.add(floor);for(let x of [-3.7,3.5]){let t=new THREE.Group();let tr=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,.8,12),mat('#986547'));tr.position.y=.1;t.add(tr);sph(t,'#52b979',[.75,.9,.7],[0,.8,0]);t.position.set(x,-.3,-1);scene.add(t)}for(let i=0;i<5;i++){let c=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),new THREE.MeshBasicMaterial({color:'#fff',transparent:true,opacity:.8}));c.position.set(-4+i*2,3.5+(i%2)*.5,-2);scene.add(c)}egg=new THREE.Group();let em=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),mat('#fff0b8'));em.scale.set(.8,1.15,.8);em.position.y=.1;egg.add(em);egg.position.y=.05;scene.add(egg);dino=new THREE.Group();dino.scale.setScalar(.68);sph(dino,'#66c887',[1.3,1.1,.9],[0,0,0]);sph(dino,'#76d895',[1.1,.92,.88],[0,1.45,.05]);sph(dino,'#fff',[.18,.2,.12],[-.43,1.65,.78]);sph(dino,'#fff',[.18,.2,.12],[.43,1.65,.78]);sph(dino,'#282442',[.07,.09,.06],[-.43,1.65,.9]);sph(dino,'#282442',[.07,.09,.06],[.43,1.65,.9]);sph(dino,'#fff0bc',[.62,.35,.55],[0,1.18,.78]);mouth=new THREE.Mesh(new THREE.TorusGeometry(.18,.025,8,18,Math.PI),mat('#282442'));mouth.rotation.x=Math.PI/2;mouth.position.set(0,1.1,1.28);dino.add(mouth);sph(dino,'#399d72',[.35,.6,.35],[-.6,-.85,.1]);sph(dino,'#399d72',[.35,.6,.35],[.6,-.85,.1]);let tail=new THREE.Mesh(new THREE.ConeGeometry(.4,2,20),mat('#399d72'));tail.rotation.z=-Math.PI/2.5;tail.position.set(-1.3,0,0);dino.add(tail);dino.position.y=.1;dino.visible=false;scene.add(dino);resize();requestAnimationFrame(loop)}
function resize(){let r=document.querySelector('.game');camera.aspect=r.clientWidth/r.clientHeight;camera.updateProjectionMatrix();renderer.setSize(r.clientWidth,r.clientHeight,false)}function mouthPos(){let v=new THREE.Vector3();mouth.getWorldPosition(v);v.project(camera);let r=renderer.domElement.getBoundingClientRect();return{x:r.left+(v.x+1)*r.width/2,y:r.top+(-v.y+1)*r.height/2}}function select(k){if(!s.born){say('Primeiro, ajude o ovo a nascer!');return}chosen=k;document.querySelectorAll('.food').forEach(b=>b.classList.toggle('selected',b.dataset.food===k));$('hint').textContent='Arraste '+foods[k][1]+' até minha boca.'}function start(k,x,y){select(k);dragging=true;moved=false;$('drag').textContent=foods[k][0];$('drag').style.display='block';move(x,y)}function move(x,y){$('drag').style.left=x+'px';$('drag').style.top=y+'px'}function finish(x,y){if(!dragging)return;dragging=false;if(!moved){$('drag').style.display='none';return}let p=mouthPos();if(Math.hypot(x-p.x,y-p.y)<100){let d=$('drag'),st=performance.now(),sx=x,sy=y;function fly(now){let q=Math.min(1,(now-st)/400),e=1-Math.pow(1-q,3);move(sx+(p.x-sx)*e,sy+(p.y-sy)*e);if(q<1)requestAnimationFrame(fly);else{d.style.display='none';let f=foods[chosen];s.food=clamp(s.food+f[2]);s.fun=clamp(s.fun+4);s.energy=clamp(s.energy+3);s.care++;chew=1.4;say('Nhac nhac! A '+f[1]+' estava deliciosa! '+f[0]);update()}}requestAnimationFrame(fly)}else{$('drag').style.display='none';say('Leve a comida até minha boca!')}}
function action(k){if(!s.born){say('Primeiro, ajude o ovo a nascer!');return}if(k==='pet'){s.fun=clamp(s.fun+15);say('Adoro carinho! 💖')}if(k==='play'){if(s.energy<15){say('Estou cansado...');return}s.fun=clamp(s.fun+24);s.energy=clamp(s.energy-15);s.food=clamp(s.food-5);say('Foi muito divertido! 🎾')}if(k==='clean'){s.clean=clamp(s.clean+30);say('Agora estou limpinho! 🫧')}if(k==='sleep'){sleeping=!sleeping;say(sleeping?'Zzz... 🌙':'Bom dia! ☀️')}s.care++;update()}
$('hatch').onclick=()=>{if(!s.born){s.born=true;egg.visible=false;dino.visible=true;say('Nasci! Obrigado por cuidar de mim 💖');update()}};$('pet').onclick=()=>action('pet');$('play').onclick=()=>action('play');$('clean').onclick=()=>action('clean');$('sleep').onclick=()=>action('sleep');$('saveName').onclick=()=>{s.name=$('nameInput').value.trim()||'Meu Dino';update()};$('reset').onclick=()=>{if(confirm('Começar de novo?')){s=Object.assign({}, {name:'Meu Dino',food:55,fun:60,energy:70,clean:65,age:0,care:0,born:false,last:Date.now()});egg.visible=true;dino.visible=false;say('Um pequeno ovo está esperando por você...');update()}};document.querySelectorAll('.food').forEach(b=>b.onpointerdown=e=>{e.preventDefault();start(b.dataset.food,e.clientX,e.clientY);b.setPointerCapture?.(e.pointerId)});document.onpointermove=e=>{if(dragging){moved=true;move(e.clientX,e.clientY)}};document.onpointerup=e=>finish(e.clientX,e.clientY);function loop(t){requestAnimationFrame(loop);let time=t*.001;if(egg.visible)egg.position.y=.05+Math.sin(time*2)*.05;if(dino.visible){dino.position.y=.1+Math.sin(time*2)*.03;dino.rotation.y=Math.sin(time)*.08;if(chew>0){mouth.scale.y=1+Math.sin(time*24)*.12;chew-=.016}else mouth.scale.y=1}renderer.render(scene,camera)}window.onresize=resize;setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(s.born){s.food=clamp(s.food-.08);s.fun=clamp(s.fun-.05);s.clean=clamp(s.clean-.07);s.energy=clamp(s.energy+(sleeping?.16:-.025));update()}},10000);init();update();
</script></body></html>
