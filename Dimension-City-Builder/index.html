<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dimension City Builder</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#e9f2ff;background:#0d1422}#app{height:100%;position:relative}#scene{position:absolute;inset:0}canvas{display:block}.hud{position:absolute;z-index:2;inset:0;pointer-events:none}.topbar{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:12px;background:linear-gradient(90deg,#111b2ddd,#111b2d55);border-bottom:1px solid #7ca4ca55}.brand{font-weight:900;letter-spacing:.6px;margin-right:auto}.pill{padding:8px 12px;border:1px solid #8cb5db66;border-radius:12px;background:#17263bdd;font-weight:800}.toolbar{pointer-events:auto;position:absolute;left:16px;top:76px;width:230px;padding:12px;border:1px solid #8cb5db66;border-radius:18px;background:#111b2de8;box-shadow:0 12px 35px #0005}.toolbar h3{margin:0 0 10px;font-size:14px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool,button{font:inherit;color:inherit;border:1px solid #8cb5db77;border-radius:10px;background:#1d3048;padding:9px;cursor:pointer;font-weight:700}.tool.active,.tool:hover,button:hover{background:#3473a9}.wide{width:100%;margin-top:8px}.help{position:absolute;bottom:16px;left:16px;max-width:430px;padding:9px 12px;border-radius:12px;background:#111b2dcc;color:#bcd0e5;font-size:12px}.legend{pointer-events:auto;position:absolute;right:16px;top:76px;width:210px;padding:12px;border-radius:18px;background:#111b2de8;border:1px solid #8cb5db66;font-size:12px}.legend b{display:block;margin-bottom:7px}.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:12px}.modal{display:none;position:absolute;inset:0;place-items:center;background:#0008;pointer-events:auto}.card{width:min(420px,90vw);padding:22px;border-radius:20px;background:#17263b;border:1px solid #8cb5db88}.card h2{margin-top:0}.card button{margin-top:12px}@media(max-width:700px){.toolbar{width:190px}.legend{display:none}.brand{font-size:12px}.pill{font-size:11px;padding:7px}}
</style></head>
<body><div id="app"><div id="scene"></div><div class="hud"><div class="topbar"><div class="brand">◈ DIMENSION CITY BUILDER</div><div class="pill">💰 <span id="money">12000</span></div><div class="pill">👥 <span id="population">0</span></div><div class="pill">⚡ <span id="power">0</span></div><div class="pill">💧 <span id="water">0</span></div></div><aside class="toolbar"><h3>RÉGUA DE CONSTRUÇÃO</h3><div class="tools"><button class="tool active" data-mode="select">🖐 Selecionar</button><button class="tool" data-mode="road">🛣 Estrada</button><button class="tool" data-mode="residential">🏠 Residencial</button><button class="tool" data-mode="commercial">🏪 Comercial</button><button class="tool" data-mode="industrial">🏭 Industrial</button><button class="tool" data-mode="power">⚡ Energia</button><button class="tool" data-mode="water">💧 Água</button><button class="tool" data-mode="park">🌳 Parque</button></div><button id="dimension" class="wide">🌌 Mudar dimensão</button><button id="newMap" class="wide">🔄 Novo mapa</button><button id="save" class="wide">💾 Salvar cidade</button></aside><aside class="legend"><b>Dimensão <span id="dimensionName">Aurora</span></b><div class="stats"><span class="stat"><i class="dot" style="background:#5b8d55"></i>Residencial</span><span class="stat"><i class="dot" style="background:#db9b4d"></i>Comercial</span><span class="stat"><i class="dot" style="background:#b75d58"></i>Industrial</span><span class="stat"><i class="dot" style="background:#62b8c9"></i>Serviços</span></div></aside><div class="help">Clique nos terrenos para construir. Use o botão Selecionar para remover estruturas. Arraste com o botão direito para girar a câmera e use a roda para aproximar.</div><div id="modal" class="modal"><div class="card"><h2 id="modalTitle">Terreno</h2><p id="modalText"></p><button id="closeModal">Fechar</button></div></div></div></div>
<script type="module">
import * as THREE from './vendor/three.module.js';
const $=id=>document.getElementById(id),N=18,KEY='dimension-city-builder-save';let scene,camera,renderer,ray,mouse,root,tiles=[],mode='select',money=12000,dimension=0,population=0,power=0,water=0;const modes={road:{label:'Estrada',cost:80,color:0x4c5668},residential:{label:'Zona residencial',cost:180,color:0x5b8d55},commercial:{label:'Zona comercial',cost:260,color:0xdb9b4d},industrial:{label:'Zona industrial',cost:340,color:0xb75d58},power:{label:'Usina de energia',cost:700,color:0xefd36a},water:{label:'Caixa d\'água',cost:600,color:0x62b8c9},park:{label:'Parque',cost:120,color:0x57b987}};const dimensions=[{name:'Aurora',ground:0x6b9b61,sky:0x9ccff1},{name:'Âmbar',ground:0xa87b54,sky:0xe8b26f},{name:'Violeta',ground:0x655987,sky:0xb99be8}];
function save(){localStorage.setItem(KEY,JSON.stringify({money,population,power,water,dimension,tiles:tiles.map(t=>t.type)}))}function update(){for(const [id,v] of [['money',money],['population',population],['power',power],['water',water]])$(id).textContent=Math.max(0,Math.round(v));$('dimensionName').textContent=dimensions[dimension].name}function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.82})}function makeTile(x,z){let g=new THREE.Group(),base=new THREE.Mesh(new THREE.BoxGeometry(.94,.12,.94),material(dimensions[dimension].ground));base.position.y=-.06;base.receiveShadow=true;g.add(base);g.position.set(x,0,z);scene.add(g);let t={g,x,z,type:null,obj:null};tiles.push(t);return t}function cube(t,c,h=.45){let m=new THREE.Mesh(new THREE.BoxGeometry(.65,h,.65),material(c));m.position.y=h/2+.01;m.castShadow=true;t.g.add(m);return m}function build(t,type){let def=modes[type];if(!def)return;if(type==='road'){let r=new THREE.Mesh(new THREE.BoxGeometry(.9,.035,.9),material(def.color));r.position.y=.02;t.g.add(r);return r}if(type==='park'){let p=cube(t,def.color,.08);for(let i=0;i<3;i++){let tr=cube(t,0x755238,.25);tr.scale.set(.18,1,.18);tr.position.set(-.2+i*.2,.17,.05)}return p}if(type==='power'){let b=cube(t,def.color,.7);let pole=cube(t,0x6e7480,1.0);pole.scale.set(.13,1,.13);pole.position.y=.7;return b}if(type==='water'){let b=cube(t,def.color,.55);b.scale.set(.75,1,.75);return b}let b=cube(t,def.color,type==='industrial'?.7:type==='commercial'?.6:.5);if(type==='residential'){for(let i=0;i<2;i++){let roof=new THREE.Mesh(new THREE.ConeGeometry(.24,.28,4),material(0x6b4355));roof.position.set(-.18+i*.36,.75,0);roof.rotation.y=Math.PI/4;roof.castShadow=true;t.g.add(roof)}}else if(type==='industrial'){let chimney=cube(t,0x6b4c4c,.9);chimney.scale.set(.18,1,.18);chimney.position.set(.22,.7,.1)}return b}function resetWorld(){tiles.forEach(t=>scene.remove(t.g));tiles=[];for(let z=-(N-1)/2;z<=(N-1)/2;z++)for(let x=-(N-1)/2;x<=(N-1)/2;x++)makeTile(x,z);money=12000;population=power=water=0;update();save()}function apply(t,type){if(t.type){if(type==='select'){money+=modes[t.type]?.cost||0;t.g.remove(t.obj);t.type=null;t.obj=null;population=Math.max(0,population-(t.lastPop||0));power=Math.max(0,power-(t.lastPower||0));water=Math.max(0,water-(t.lastWater||0));update();save()}return}let d=modes[type];if(!d||money<d.cost){say('Recursos insuficientes para esta construção.');return}money-=d.cost;t.type=type;t.obj=build(t,type);t.lastPop=type==='residential'?12:0;t.lastPower=type==='power'?80:0;t.lastWater=type==='water'?80:0;population+=t.lastPop;power+=t.lastPower;water+=t.lastWater;update();save()}function say(text){$('modalTitle').textContent='Aviso';$('modalText').textContent=text;$('modal').style.display='grid'}function clickWorld(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(tiles.map(t=>t.g),true)[0];if(!hit)return;let t=tiles.find(a=>a.g===hit.object||a.g.children.includes(hit.object));if(t)apply(t,mode)}function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.set(10,14,16);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;$('scene').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xddeeff,0x344252,2.4));let sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-8,14,8);sun.castShadow=true;scene.add(sun);ray=new THREE.Raycaster();mouse=new THREE.Vector2();root=new THREE.Group();scene.add(root);resetWorld();resize();renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===0)clickWorld(e)});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('wheel',e=>{camera.position.multiplyScalar(e.deltaY>0?1.08:.92);camera.position.y=Math.max(5,Math.min(30,camera.position.y));camera.lookAt(0,0,0)});requestAnimationFrame(loop)}function resize(){let r=$('scene').getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height,false)}function loop(t){requestAnimationFrame(loop);if(renderer)renderer.render(scene,camera)}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b))});$('newMap').onclick=resetWorld;$('save').onclick=()=>{save();say('Cidade salva neste computador.')};$('closeModal').onclick=()=>$('modal').style.display='none';$('dimension').onclick=()=>{dimension=(dimension+1)%dimensions.length;scene.background=new THREE.Color(dimensions[dimension].sky);tiles.forEach(t=>{t.g.children[0].material=material(dimensions[dimension].ground)});update();save();say('Você atravessou para a dimensão '+dimensions[dimension].name+'.')};const old=localStorage.getItem(KEY);if(old){try{let s=JSON.parse(old);money=s.money??money;population=s.population??0;power=s.power??0;water=s.water??0;dimension=s.dimension??0}catch(e){}}window.onresize=resize;init();update();
</script></body></html>
